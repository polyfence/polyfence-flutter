name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  validate-version-sync:
    name: Validate Version Sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Extract and validate versions match
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PUBSPEC_VERSION=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')
          echo "Tag version:     $TAG_VERSION"
          echo "pubspec version: $PUBSPEC_VERSION"
          if [ "$TAG_VERSION" != "$PUBSPEC_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match pubspec.yaml version ($PUBSPEC_VERSION). If pubspec has a +N build suffix, the tag must include it (e.g. v0.14.0+1)."
            exit 1
          fi
          echo "Versions match: $TAG_VERSION"

  validate-code:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  publish-pub:
    name: Publish to pub.dev
    runs-on: ubuntu-latest
    needs: [validate-version-sync, validate-code]
    permissions:
      # GitHub Actions: declaring ANY explicit permissions implicitly sets all
      # others to `none`. Without `contents: read`, `actions/checkout` fails
      # with "Repository not found" (this killed v0.14.0 and v0.14.1 publish
      # attempts). `id-token: write` is required by pub.dev's OIDC exchange.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      # pub has no OIDC code of its own. This action reads
      # ACTIONS_ID_TOKEN_REQUEST_URL, mints a GitHub-signed token for audience
      # https://pub.dev, exports it as PUB_TOKEN and runs
      # `dart pub token add https://pub.dev --env-var PUB_TOKEN`. Without it,
      # pub finds no credential and falls back to interactive Google OAuth,
      # which on a runner hangs until the job is cancelled.
      - uses: dart-lang/setup-dart@v1

      # Flutter goes AFTER setup-dart so its bundled `dart` shadows the
      # standalone SDK on PATH; a plugin cannot be resolved by pure Dart. The
      # credential lives in the pub token store and $PUB_TOKEN, so both see it.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Temporary. Remove once this workflow has published successfully once.
      # Prints whether the OIDC token reached the job and which claims it
      # carries, so a failure says why instead of hanging silently. Never
      # prints the token, only its length and its non-secret claims.
      - name: Diagnose pub.dev OIDC
        run: |
          [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]   && echo "REQUEST_URL: present"   || echo "REQUEST_URL: MISSING"
          [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ] && echo "REQUEST_TOKEN: present" || echo "REQUEST_TOKEN: MISSING"
          [ -n "${PUB_TOKEN:-}" ] && echo "PUB_TOKEN: present (${#PUB_TOKEN} chars)" || echo "PUB_TOKEN: MISSING"
          echo "--- pub token store ---"
          dart pub token list
          echo "--- OIDC claims (audience pub.dev) ---"
          curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Fpub.dev" \
          | jq -r .value | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null \
          | jq '{aud, sub, repository, ref, event_name, repository_owner}'

      - run: flutter pub get

      - name: Publish
        run: dart pub publish --force

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [publish-pub]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
